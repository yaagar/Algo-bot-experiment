# Experiment 7 numbers (docs/EXPERIMENT_7_SPEC.md v0.10 DRAFT). Copied from the spec; never tuned.
spec_version: "1.0"
symbol: XAUUSD.sim
m1_file: XAUUSD.sim_M1.parquet          # data/processed/ (M15 is built from M1)
h1_file: XAUUSD.sim_H1.parquet          # broker H1 bars
tick_spread_frac: results/exp7/e7_tick_spread_frac.json   # 2026 tick p75 spread as a fraction of price, per server hour
data_grant: exp7              # src/data_access.py standing grant (XAUUSD + calendar from 2019-01-01)

periods:
  development: {start: "2019-01-01", end: "2026-01-01"}    # [start, end) UTC
  # exam 2010-01-01 -> 2018-12-31: one run, later (needs Yash's dated confirmation)

swing_bars: 5                 # §3 swing = highest high / lowest low of the 5 H1 bars centred on it
trend_swings: 3               # last 3 swing highs rising AND last 3 swing lows rising
tstat_bars: 48                # OLS slope of the last 48 H1 closes
tstat_min: 2.0
atr_bars: 14                  # ATR(14, H1) and ATR(14, M15), Wilder smoothing
box_min_bars: 6
box_max_range_atr_h1: 1.5     # combined high-low of the box run <= 1.5 x ATR(14, H1)
box_max_gap_min: 30           # a gap > 30 min between bars (daily break, weekend) ends a run
max_false_breaks: 1           # more than 1 blocks
chop_bars: 14
chop_max: 61.8
box_max_height_atr_m15: 3.0
stop_min_atr_m15: 1.0
round_level: 10.0             # round $10 levels
round_buffer: 0.5             # $0.50
target_r: 2.0                 # v1.0: fixed 2R target
risk_usd: 50.0                # 1R
contract_size: 100.0          # oz per lot
commission_pct_per_side: 0.0007
tick_size: 0.001              # slippage stress = 1 tick per fill
cost_guard_max_spread_frac: 0.10
entry_hours_london: ["07:00", "20:00"]   # fill time in [07:00, 20:00) London
news_blackout_min: 5
time_exit_london: "20:00"

seeds: 1000                   # C1 and C2 seeds each
m2:                           # meta-labeling layer (spec §5), no tuning
  l2_c: 1.0
  threshold: 0.40
  first_year: 2021
  last_year: 2025
variants:                     # robustness variants (reported, never selected)
  box_min_bars_5: {box_min_bars: 5}
  box_min_bars_8: {box_min_bars: 8}
  box_range_1.25: {box_max_range_atr_h1: 1.25}
  box_range_1.75: {box_max_range_atr_h1: 1.75}
  tstat_1.5: {tstat_min: 1.5}
  tstat_2.5: {tstat_min: 2.5}
